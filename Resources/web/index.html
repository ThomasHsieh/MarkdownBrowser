<!DOCTYPE html>
<html lang="zh-TW" data-font="kai" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkdownBrowser</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="print.css" media="print">
</head>
<body>
<div id="find-bar" hidden>
  <input id="find-input" type="search" placeholder="搜尋…" spellcheck="false" autocomplete="off">
  <span id="find-count">0／0</span>
  <button id="find-prev" title="上一筆 (Shift-Enter)">‹</button>
  <button id="find-next" title="下一筆 (Enter)">›</button>
  <button id="find-close" title="關閉 (Esc)">✕</button>
</div>
<main id="content"></main>
<script src="vendor/markdown-it.min.js"></script>
<script src="app.js"></script>
<script src="book.js"></script>
<script src="highlights.js"></script>
</body>
</html>
